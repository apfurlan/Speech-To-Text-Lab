[project]
name = "speech-to-text-lab"
version = "0.1.0"
description = "Laboratório de transcrição offline de áudios com Vosk"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["vosk==0.3.45", "pydantic>=2.10,<3", "typer>=0.15,<1"]

[project.scripts]
stt-lab = "stt_lab.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stt_lab"]

[dependency-groups]
dev = ["basedpyright>=1.28", "ruff>=0.11"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
include = ["src"]
stubPath = "typings"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D203", "D213", "CPY001"]

[tool.ruff.lint.per-file-ignores]
"typings/**/*.pyi" = ["N802", "N803", "D"] # Nomes da API nativa Vosk.

[tool.ruff.lint.pydocstyle]
convention = "google"
